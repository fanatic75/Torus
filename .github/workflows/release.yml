name: Release

# Full auto-release. Bump the version in addon.xml and push to main — that's it.
# CI regenerates docs/ (addons.xml, md5, the packaged addon zip, landing page),
# commits it back to main (so Kodi auto-update via GitHub Pages sees the new
# version), then cuts tag v<version> + a GitHub Release with the zip and notes.
#
# Idempotent: if a Release for the current version already exists, it no-ops.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read addon version
        id: ver
        run: echo "v=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")" >> "$GITHUB_OUTPUT"

      - name: Does a Release for this version already exist?
        id: gate
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "do=false" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.v }} already exists — nothing to do."
          else
            echo "do=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package docs/ from addon.xml
        if: steps.gate.outputs.do == 'true'
        run: python3 package.py

      - name: Commit packaged docs/ back to main (if changed)
        if: steps.gate.outputs.do == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "docs/ already up to date."
          else
            git commit -m "chore: package v${{ steps.ver.outputs.v }} [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        if: steps.gate.outputs.do == 'true'
        run: |
          V="${{ steps.ver.outputs.v }}"
          gh release create "v$V" \
            "docs/plugin.video.torus/plugin.video.torus-$V.zip#plugin.video.torus-$V.zip (Kodi addon)" \
            --title "Torus v$V" \
            --generate-notes \
            --latest \
            --target "${{ steps.commit.outputs.sha }}"
